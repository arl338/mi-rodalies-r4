name: Validació geometria del PDF oficial R1
on:
  push:
    branches: [fix/r1-station-coverage-and-rl3-investigation-20261112]
    paths: ['scripts/audit_r1_pdf_grid.py','.github/workflows/audit-r1-pdf-grid.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install 'pymupdf>=1.24,<1.28'
      - run: python scripts/audit_r1_pdf_grid.py
