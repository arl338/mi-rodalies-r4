name: Auditoría procedencia horarios Trenalia · sin despliegue
on:
  push:
    branches: [audit/official-stations-live-correlation-20261111]
    paths:
      - 'scripts/audit_trenalia_provenance.py'
      - '.github/workflows/audit-trenalia-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar pertenencia de líneas y referencias
        run: python scripts/audit_trenalia_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: trenalia-source-provenance
          path: trenalia-source-provenance.json
          retention-days: 7
