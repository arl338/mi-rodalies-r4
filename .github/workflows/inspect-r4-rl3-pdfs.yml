name: Inspect R4 and RL3 official PDF candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-r4-rl3-pdfs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<1.28'
      - name: Compare RL3 candidate with verified cells
        run: |
          mkdir -p /tmp/pdf-review
          if python scripts/extract_official_rl3.py --out /tmp/pdf-review/rl3-candidate.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('data/reference/rl3_official_timetable.json').read_text())
          new=json.loads(Path('/tmp/pdf-review/rl3-candidate.json').read_text())
          def rows(doc):
              return {(x['train_number'],x['calendar'],x['direction']):x['stops'] for x in doc['services']}
          a,b=rows(old),rows(new)
          print('RL3 added:',sorted(b.keys()-a.keys()))
          print('RL3 removed:',sorted(a.keys()-b.keys()))
          print('RL3 changed:',[(k,a[k],b[k]) for k in a.keys() & b.keys() if a[k]!=b[k]])
          PY
          else
            echo '::warning::RL3 candidate failed existing extraction checks; manual review required'
          fi
      - name: Inspect R4 northbound PDF geometry
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import fitz,json,re
          from extract_official_r4 import fetch_pdf
          from pathlib import Path
          raw=fetch_pdf()
          Path('/tmp/pdf-review/R4.pdf').write_bytes(raw)
          doc=fitz.open(stream=raw,filetype='pdf')
          for i,page in enumerate(doc):
              words=page.get_text('words')
              Path(f'/tmp/pdf-review/r4-page-{i+1}.json').write_text(json.dumps(words,ensure_ascii=False))
              clocks=[w for w in words if re.fullmatch(r'\d{1,2}\.\d{2}',w[4])]
              print('PAGE',i+1,'SIZE',page.rect,'CLOCKS',len(clocks))
              print('HEADER',[(round(w[0],1),round(w[1],1),w[4]) for w in words if w[1]<530][:160])
              from collections import Counter
              print('CLOCK X CLUSTERS',Counter(round(w[0]/2)*2 for w in clocks).most_common(65))
          PY
      - name: Validate candidate northbound station grid against GTFS
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,fitz
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from extract_official_r4 import station_order,parse_grid
          root=Path('data/v2')
          catalog=json.loads((root/'catalog.json').read_text())
          day=root/(catalog['coverage_start']+'.json')
          north,south=station_order(day)
          pdf=fitz.open('/tmp/pdf-review/R4.pdf')
          # Existing parser excludes x<32; test explicit page-specific anchors
          # without modifying production extraction.
          import extract_official_r4 as ex
          original=ex.cell_words
          def north_cells(page):
              out=[]
              for w in page.get_text('words'):
                  m=ex.TIME.fullmatch(w[4])
                  if m and 18<=w[0]<=940 and 530<=w[1]<=2240:
                      h,mn=map(int,m.groups())
                      if h<24 and mn<60:out.append((w[0],w[1],h*60+mn))
              return out
          ex.cell_words=north_cells
          candidates=[]
          for i,calendar in enumerate(('weekday','weekend')):
              rows,quality=parse_grid(pdf[i],north,calendar,'north')
              print('NORTH_GRID',calendar,json.dumps(quality))
              candidates.extend(rows)
          tz=ZoneInfo('Europe/Madrid')
          def minute(t):
              d=datetime.fromtimestamp(t,tz)
              return d.hour*60+d.minute
          for p in sorted(root.glob('2026-*.json')):
              d=datetime.fromisoformat(p.stem)
              calendar='weekend' if d.weekday()>=5 else 'weekday'
              observed=[t for t in json.loads(p.read_text())['trains'] if t.get('l')=='R4' and t.get('src')=='cer']
              witnesses=[]
              for t in observed:
                  s={x[0]:minute(x[2]) for x in t['s']}
                  if '71801' in s and '78710' in s and s['71801']<s['78710']:witnesses.append(s)
              if not witnesses:continue
              rows=[t for t in candidates if t['calendar']==calendar]
              matched=0
              for t in rows:
                  s=dict(t['stops'])
                  if '71801' not in s or '78710' not in s:continue
                  if any(abs(s['71801']-w['71801'])<=2 and abs(s['78710']-w['78710'])<=2 for w in witnesses):matched+=1
              print('NORTH_GTFS_CHECK',p.stem,'witnesses',len(witnesses),'matched_candidates',matched)
          # Compare complete candidate stop sequences, not just two endpoints.
          from collections import Counter
          for calendar in ('weekday','weekend'):
              pool=[]
              for p in sorted(root.glob('2026-*.json')):
                  d=datetime.fromisoformat(p.stem)
                  if ('weekend' if d.weekday()>=5 else 'weekday')!=calendar:continue
                  for t in json.loads(p.read_text())['trains']:
                      if t.get('l')=='R4' and t.get('src')=='cer':
                          pool.append({x[0]:minute(x[2]) for x in t['s']})
              for t in candidates:
                  if t['calendar']!=calendar:continue
                  s=dict(t['stops'])
                  best=max((sum(k in w and abs(v-w[k])<=2 for k,v in s.items()) for w in pool),default=0)
                  print('NORTH_ROW_WITNESS',t['id'],'stops',len(s),'matched',best,'cells',json.dumps(t['stops']))
          Path('/tmp/pdf-review/r4-north-candidate.json').write_text(json.dumps(candidates))
          PY
      - name: Inspect source-specific holiday calendar wording
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import fitz,json,re,urllib.request
          from pathlib import Path
          root=Path('data/reference')
          urls=set()
          for p in list(root.glob('*timetable*.json'))+[root/'official_regional_verified.json']:
              d=json.loads(p.read_text())
              if isinstance(d.get('source'),str):urls.add(d['source'])
              if isinstance(d.get('sources'),dict):
                  urls.update(v for v in d['sources'].values() if isinstance(v,str))
          for url in sorted(urls):
              if not url.startswith('https://rodalies.gencat.cat/'):continue
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:raw=r.read(15*1024*1024+1)
                  if len(raw)>15*1024*1024:raise ValueError('PDF too large')
                  doc=fitz.open(stream=raw,filetype='pdf')
                  for i,page in enumerate(doc):
                      lines=page.get_text().splitlines()
                      hits=[(j,x) for j,x in enumerate(lines) if re.search(r'festi|laborab|dissabte|diumenge|sábado|domingo|holiday',x,re.I)]
                      print('CALENDAR_SOURCE',url,'PAGE',i+1,json.dumps(hits,ensure_ascii=False))
              except Exception as e:print('CALENDAR_UNAVAILABLE',url,str(e))
          PY
      - name: Inspect regional train-number styles and calendar legends
        run: |
          python - <<'PY'
          import fitz,json,urllib.request,re
          from pathlib import Path
          root=Path('data/reference')
          docs=[json.loads((root/n).read_text()) for n in ('official_regional_verified.json','additional_official_timetables.json')]
          for d in docs:
              for url in sorted(set(d['sources'].values())):
                  lines={k for k,v in d['sources'].items() if v==url}&{'R11','R13','R14','R15','R16','R17'}
                  if not lines:continue
                  nums={s['train_number'] for s in d['services'] if s['line'] in lines}
                  with urllib.request.urlopen(url,timeout=30) as response:raw=response.read(15*1024*1024+1)
                  if len(raw)>15*1024*1024:raise ValueError('PDF too large')
                  pdf=fitz.open(stream=raw,filetype='pdf')
                  for i,page in enumerate(pdf):
                      spans=[s for b in page.get_text('dict')['blocks'] if 'lines' in b for l in b['lines'] for s in l['spans']]
                      for s in spans:
                          if any(re.search(r'(?<!\d)'+re.escape(n)+r'(?!\d)',s['text']) for n in nums) or re.search(r'festi|laborab|dissabte|diumenge|sábado|domingo',s['text'],re.I):
                              print('REGIONAL_STYLE',','.join(sorted(lines)),i+1,json.dumps({k:s[k] for k in ('text','bbox','color','font','flags')},ensure_ascii=False))
                      Path('/tmp/pdf-review/'+url.rsplit('/',1)[-1]+f'-page-{i+1}-drawings.json').write_text(json.dumps(page.get_drawings(),default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-review-candidates
          path: /tmp/pdf-review/
          retention-days: 5
