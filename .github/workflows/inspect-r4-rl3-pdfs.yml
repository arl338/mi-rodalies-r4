name: Inspect R4 and RL3 official PDF candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-r4-rl3-pdfs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<1.28'
      - name: Compare RL3 candidate with verified cells
        run: |
          mkdir -p /tmp/pdf-review
          if python scripts/extract_official_rl3.py --out /tmp/pdf-review/rl3-candidate.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('data/reference/rl3_official_timetable.json').read_text())
          new=json.loads(Path('/tmp/pdf-review/rl3-candidate.json').read_text())
          def rows(doc):
              return {(x['train_number'],x['calendar'],x['direction']):x['stops'] for x in doc['services']}
          a,b=rows(old),rows(new)
          print('RL3 added:',sorted(b.keys()-a.keys()))
          print('RL3 removed:',sorted(a.keys()-b.keys()))
          print('RL3 changed:',[(k,a[k],b[k]) for k in a.keys() & b.keys() if a[k]!=b[k]])
          PY
          else
            echo '::warning::RL3 candidate failed existing extraction checks; manual review required'
          fi
      - name: Inspect R4 northbound PDF geometry
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import fitz,json,re
          from extract_official_r4 import fetch_pdf
          from pathlib import Path
          raw=fetch_pdf()
          Path('/tmp/pdf-review/R4.pdf').write_bytes(raw)
          doc=fitz.open(stream=raw,filetype='pdf')
          for i,page in enumerate(doc):
              words=page.get_text('words')
              Path(f'/tmp/pdf-review/r4-page-{i+1}.json').write_text(json.dumps(words,ensure_ascii=False))
              clocks=[w for w in words if re.fullmatch(r'\d{1,2}\.\d{2}',w[4])]
              print('PAGE',i+1,'SIZE',page.rect,'CLOCKS',len(clocks))
              print('HEADER',[(round(w[0],1),round(w[1],1),w[4]) for w in words if w[1]<530][:160])
              from collections import Counter
              print('CLOCK X CLUSTERS',Counter(round(w[0]/2)*2 for w in clocks).most_common(65))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-review-candidates
          path: /tmp/pdf-review/
          retention-days: 5
