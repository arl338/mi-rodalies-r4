name: R4 timetable by train-number diagnostic
on:
  push:
    branches: [audit/r4-eta-direction-confidence-20261112]
    paths: ['scripts/probe_r4_number_timetable.cjs','.github/workflows/probe-r4-number-timetable.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/probe_r4_number_timetable.cjs
          node scripts/probe_r4_number_timetable.cjs
