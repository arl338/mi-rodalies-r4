name: Diagnóstico rechazo de horarios alternativos
on:
  push:
    branches: [audit/official-stations-live-correlation-20261111]
    paths: ['scripts/audit_trenalia_rejections.cjs','.github/workflows/diagnose-timetable-rejections.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: node --check scripts/audit_trenalia_rejections.cjs
      - name: Comparar rechazos con respuesta real
        run: node scripts/audit_trenalia_rejections.cjs
