name: Precision audit - source semantics and cache age
on:
  push:
    branches: [audit/final-precision-proof-20261111]
    paths:
      - engine.js
      - tests/test_schedule_vs_eta.cjs
      - tests/test_response_cache_age.cjs
      - .github/workflows/test-final-precision.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and all critical core regression tests
        run: |
          node --check engine.js
          node --check app.js
          node tests/test_engine.cjs
          node tests/test_feed_schemas.cjs
          node tests/test_precision.cjs
          node tests/test_trenalia_fallback.cjs
          node tests/test_timetable_live_correlation.cjs
          node tests/test_position_delay_fallback.cjs
          node tests/test_merge_alternative_journeys.cjs
          node tests/test_schedule_vs_eta.cjs
          node tests/test_response_cache_age.cjs
      - name: Real providers' current API contracts
        run: |
          node tests/test_trenalia_live.cjs
          node tests/test_trenalia_alignment.cjs
          node tests/test_live_anonymous_eta.cjs
