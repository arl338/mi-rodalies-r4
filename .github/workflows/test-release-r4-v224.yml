name: 'V2.2.4 - Validacio ETA R4 per sentit'
on:
  push:
    branches: [release/v2-2-4-r4-direction-eta]
  pull_request:
    paths: ['app.js','engine.js','sw.js','index.html','tests/test_r4_direction_collision.cjs','tests/test_official_r4.py','.github/workflows/test-release-r4-v224.yml']
permissions: {contents: read}
jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Sintaxi i regressions del motor
        run: |
          python -m py_compile scripts/*.py
          node --check app.js
          node --check engine.js
          node --check sw.js
          node tests/test_engine.cjs
          node tests/test_feed_schemas.cjs
          node tests/test_precision.cjs
          node tests/test_trenalia_fallback.cjs
          node tests/test_timetable_live_correlation.cjs
          node tests/test_position_delay_fallback.cjs
          node tests/test_merge_alternative_journeys.cjs
          node tests/test_schedule_vs_eta.cjs
          node tests/test_response_cache_age.cjs
          node tests/test_r4_direction_collision.cjs
          python -m unittest discover -s tests -p 'test_[!u]*.py' -q
      - name: Verificar tots els horaris GTFS i font PDF R4
        run: |
          python scripts/validate_generated.py --out data/v2 --days 14
          python - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('data/v2/catalog.json').read_text())
          assert c['official_r4_pdf']['source'].endswith('/R4.pdf')
          assert '2.2.4' in Path('index.html').read_text()
          assert 'mi-rodalies-v2.2.4' in Path('sw.js').read_text()
          print('PASS: R4 PDF + GTFS + versio PWA')
          PY
      - name: Contractes de les fonts externes
        run: |
          node tests/test_trenalia_live.cjs
          node tests/test_trenalia_alignment.cjs
          node tests/test_live_anonymous_eta.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Instal-lar navegador Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Reproduir sis sortides R4 i la 06:48 al mobil
        run: |
          mkdir -p /tmp/rodalies-r4-check
          cp data/v2/catalog.json data/v2/2026-11-12.json /tmp/rodalies-r4-check/
          python tests/test_r4_ui_full.py
      - name: Comprovar adaptacio grafica movil 320 390 768
        run: python tests/test_ui_v221.py
