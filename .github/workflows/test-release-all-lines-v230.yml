name: 'Release V2.3.0 - ETA i cobertura de les 19 linies'
on:
  push:
    branches: [release/v2-3-0-all-lines-eta-coverage]
  pull_request:
    paths:
      - 'engine.js'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_all_lines*'
      - 'tests/test_timetable_live_correlation.cjs'
      - 'tests/test_merge_alternative_journeys.cjs'
      - '.github/workflows/test-release-all-lines-v230.yml'
permissions: {contents: read}
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and every critical rail ETA regression
        run: |
          node --check engine.js
          node --check app.js
          node --check sw.js
          python -m py_compile scripts/*.py
          node tests/test_engine.cjs
          node tests/test_feed_schemas.cjs
          node tests/test_precision.cjs
          node tests/test_trenalia_fallback.cjs
          node tests/test_timetable_live_correlation.cjs
          node tests/test_position_delay_fallback.cjs
          node tests/test_merge_alternative_journeys.cjs
          node tests/test_schedule_vs_eta.cjs
          node tests/test_response_cache_age.cjs
          node tests/test_r4_direction_collision.cjs
          node tests/test_all_lines_direction.cjs
          node tests/test_all_lines_fallback.cjs
          python -m unittest discover -s tests -p 'test_[!u]*.py' -q
      - name: Verify original schedules and clean PWA version
        run: |
          python scripts/validate_generated.py --out data/v2 --days 14
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/v2/catalog.json').read_text())
          assert len(c['lines'])==19
          assert c['official_r4_pdf']['source'].endswith('/R4.pdf')
          html=Path('index.html').read_text()
          sw=Path('sw.js').read_text()
          assert '2.3.0' in html and '?v=230' in html
          assert 'mi-rodalies-v2.3.0' in sw and '?v=230' in sw
          print('OK: V2.3.0 coherent and 19 lines preserved')
          PY
      - name: Validate current public provider API contracts
        run: |
          node tests/test_trenalia_live.cjs
          node tests/test_trenalia_alignment.cjs
          node tests/test_live_anonymous_eta.cjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Browser regression 320 390 768 and ALL line mode
        run: |
          python tests/test_ui_v221.py
          python tests/test_all_lines_browser.py
