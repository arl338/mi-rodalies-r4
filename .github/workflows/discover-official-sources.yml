name: Discover official timetable sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover-official-sources.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Inspect public browser requests
        run: |
          pip install 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          import json
          targets = ['https://rodalies.gencat.cat/es/horaris/', 'https://www.renfe.com/es/es/cercanias/rodalies-catalunya/horarios']
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for target in targets:
                  context = browser.new_context()
                  page = context.new_page()
                  def report(response):
                      req = response.request
                      if req.resource_type not in ('xhr','fetch','script','document'): return
                      u = urlsplit(response.url)
                      print('RESOURCE', json.dumps({'type':req.resource_type,'method':req.method,'url':u.scheme+'://'+u.netloc+u.path,'status':response.status,'content_type':response.headers.get('content-type','')}))
                  page.on('response', report)
                  try:
                      page.goto(target, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(8000)
                      for frame in page.frames:
                          print('FRAME', urlsplit(frame.url).netloc, urlsplit(frame.url).path)
                          print('FORM', json.dumps(frame.locator('input,select,button').evaluate_all("(els)=>els.slice(0,80).map(e=>({tag:e.tagName,id:e.id,name:e.name,type:e.type,placeholder:e.placeholder,role:e.getAttribute('role'),label:e.getAttribute('aria-label')}))"), ensure_ascii=False))
                  except Exception as exc:
                      print('DISCOVERY_ERROR', type(exc).__name__)
                  finally:
                      context.close()
              browser.close()
          PY
