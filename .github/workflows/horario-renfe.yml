name: Actualizar red Rodalies · GTFS + validación Generalitat V2.0.5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'engine.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'data/reference/**'
      - '.github/workflows/horario-renfe.yml'
  workflow_dispatch:
  schedule:
    # GitHub cron runs in UTC and can be delayed. A second daily attempt
    # recovers transient failures, and the preflight skips an already valid
    # Madrid-local catalog (also on Saturdays, Sundays and holidays).
    - cron: '17 4 * * *'
    - cron: '17 11 * * *'

permissions:
  contents: write

concurrency:
  group: rodalies-v2-gtfs
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis y motor de datos
        run: |
          python -m py_compile scripts/build_network.py
          node --check app.js
          node --check engine.js
          node tests/test_engine.cjs
          node tests/test_feed_schemas.cjs
          node tests/test_precision.cjs
          # Testes unitarios del generador; los test_ui*.py usan Playwright y se ejecutan en navegador aparte.
          python -m unittest discover -s tests -p 'test_[!u]*.py' -q
      - name: Verificar frescura del lote diario en horario de Madrid
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/check_daily_refresh.py --out data/v2 --mode schedule --github-output "$GITHUB_OUTPUT"
          else
            python scripts/check_daily_refresh.py --out data/v2 --mode force --github-output "$GITHUB_OUTPUT"
          fi
      - name: Conservar catálogo validado anterior como referencia de calidad
        if: steps.freshness.outputs.refresh == 'true'
        shell: bash
        run: |
          if [ -f data/v2/catalog.json ]; then
            cp data/v2/catalog.json /tmp/rodalies-previous-catalog.json
          fi
      - name: Descargar fuente GTFS Cercanías verificable
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_network import download, CERCANIAS
          raw = download(CERCANIAS)
          Path('/tmp/rodalies-cer.zip').write_bytes(raw)
          print('Fuente GTFS Cercanías descargada una única vez:', len(raw), 'bytes')
          PY
      - name: Auditar paradas originales GTFS Renfe
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/audit_gtfs.py --zip /tmp/rodalies-cer.zip --days 14 --out data/v2/source_audit.json
      - name: Obtener GTFS Renfe y contrastar líneas con Generalitat
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/build_network.py --cer-zip /tmp/rodalies-cer.zip --days 14 --out data/v2
      - name: Validar integridad temporal, lotes y paradas por línea
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/validate_generated.py --out data/v2 --days 14
      - name: Auditar todas las líneas y estaciones por día y fuente
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/audit_line_station_coverage.py --out data/v2
      - name: Validar JSON generado y servicios
        if: steps.freshness.outputs.refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('data/v2')
          c=json.loads((root/'catalog.json').read_text(encoding='utf8'))
          assert c['schema']==2 and len(c['stations'])>=10
          audit=c.get('official_reference',{})
          assert len(audit.get('lines',[]))==19, 'No se ha verificado el catálogo oficial Generalitat'
          assert set(x['id'] for x in audit['lines'])==set(x['id'] for x in c['lines'])
          print('Referencia Generalitat: 19 líneas cotejadas; el contraste de estaciones es indicativo, no exhaustivo')
          for line in audit['lines']:
            if line['status']=='pendiente_contraste':
              print(f"PENDIENTE {line['id']}: {', '.join(line['not_found_in_gtfs'])}")
            if line['status']=='sin_horarios_publicados':
              print(f"SIN HORARIOS {line['id']}: falta cobertura GTFS explícita")
          assert sum(x['present'] for x in c['lines'])>=1
          days=list(root.glob('20??-??-??.json'))
          assert len(days)==15
          rows=sum(len(json.loads(p.read_text(encoding='utf8'))['trains']) for p in days)
          assert rows>0
          print(f'Validación correcta: {len(c["stations"])} estaciones; {len(days)} archivos diarios; {rows} trenes')
          if c['warnings']:print('ADVERTENCIAS DE COBERTURA:', c['warnings'])
          PY
      - name: Evitar publicar pérdidas masivas de trenes o paradas
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/guard_catalog_regression.py --previous /tmp/rodalies-previous-catalog.json --current data/v2/catalog.json
      - name: Guardar catálogo y horarios oficiales
        if: steps.freshness.outputs.refresh == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Generated files stay in the working tree while main can advance.
          # Never rebase a generated-catalog commit (JSON files will conflict
          # even when both rebuilds are valid). Reset only the index/HEAD to
          # newest main, then stage data/v2/ exclusively and push atomically.
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Never attach data generated by an OLD workflow to a newer
            # source-code/reference version pushed during this run.
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- scripts/ data/reference/ .github/workflows/horario-renfe.yml; then
              echo 'El código o las referencias han cambiado durante la generación. Se descarta este lote y ejecutará su propio workflow el commit nuevo.' >&2
              exit 1
            fi
            # Concurrent runs might finish out of order. Keep the newest
            # validated batch; never replace today's newer publication
            # with an older run simply because git push succeeds.
            if git show origin/main:data/v2/catalog.json > /tmp/rodalies-remote-catalog.json 2>/dev/null; then
              if python - <<'PY'
          import json,sys
          from datetime import date,datetime
          from pathlib import Path
          remote=json.loads(Path('/tmp/rodalies-remote-catalog.json').read_text(encoding='utf8'))
          candidate=json.loads(Path('data/v2/catalog.json').read_text(encoding='utf8'))
          rd,cd=date.fromisoformat(remote['coverage_start']),date.fromisoformat(candidate['coverage_start'])
          same_or_newer=(rd>cd or (rd==cd and
              datetime.fromisoformat(remote['generated_at'])>=datetime.fromisoformat(candidate['generated_at'])))
          sys.exit(0 if same_or_newer else 1)
          PY
              then
                echo 'Ya existe un lote remoto posterior o equivalente; no se sobrescribe.'
                exit 0
              fi
            fi
            git reset --mixed origin/main
            git add -A data/v2/
            if git diff --cached --quiet; then
              echo 'Catálogo ya actualizado: no hay cambios'
              exit 0
            fi
            git commit -m 'Actualizar catálogo Rodalies y contraste Generalitat V2 [skip ci]'
            if git push origin HEAD:main; then
              echo 'Catálogo publicado sobre el último main, sin cambios de código'
              exit 0
            fi
            echo 'Main ha avanzado durante el push; reintentando sin rebase...'
            sleep 2
          done
          echo 'No se ha podido publicar el catálogo sin sobrescribir cambios' >&2
          exit 1
