
name: Actualizar horario oficial Renfe GTFS

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

jobs:
  horario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar y transformar GTFS oficial
        run: python scripts/build_gtfs.py --days 21

      - name: Publicar el horario del día y las siguientes semanas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule-r4.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar horario oficial Renfe GTFS'
            git push
          fi
