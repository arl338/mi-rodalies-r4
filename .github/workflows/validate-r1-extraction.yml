name: Extracció R1 PDF oficial verificat contra GTFS
on:
  push:
    branches: [fix/r1-station-coverage-and-rl3-investigation-20261112]
    paths: ['scripts/extract_official_r1.py','.github/workflows/validate-r1-extraction.yml']
permissions: {contents: write}
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install 'pymupdf>=1.24,<1.28'
      - name: Verify R1 against independent existing timetable
        run: python scripts/extract_official_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-r1-grid
          path: data/reference/r1_official_timetable.json
          retention-days: 5
      - name: Save reference only on isolated audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/r1_official_timetable.json
          if ! git diff --cached --quiet; then
            git commit -m 'R1: preservar cel·les verificades del PDF oficial'
            git push origin HEAD:fix/r1-station-coverage-and-rl3-investigation-20261112
          fi
