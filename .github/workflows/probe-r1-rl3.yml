name: Diagnòstic R1 per estació i RL3 sense publicació
on:
  push:
    branches: [fix/r1-station-coverage-and-rl3-investigation-20261112]
    paths:
      - 'scripts/probe_r1_rl3_direct.cjs'
      - '.github/workflows/probe-r1-rl3.yml'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/probe_r1_rl3_direct.cjs
          node scripts/probe_r1_rl3_direct.cjs
