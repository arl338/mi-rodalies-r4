name: Validar V2.2 ETA antes de publicar
on:
  push:
    branches: ['release/v2-2-precise-eta']
  pull_request:
    paths:
      - 'engine.js'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_*'
      - '.github/workflows/test-release-v22.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax JS + Python
        run: |
          node --check engine.js
          node --check app.js
          python -m py_compile scripts/*.py
      - name: Tests regresión y precisión
        run: |
          node tests/test_engine.cjs
          node tests/test_feed_schemas.cjs
          node tests/test_precision.cjs
          node tests/test_trenalia_fallback.cjs
          node tests/test_timetable_live_correlation.cjs
          node tests/test_position_delay_fallback.cjs
          node tests/test_merge_alternative_journeys.cjs
          python -m unittest discover -s tests -p 'test_[!u]*.py' -q
      - name: Validez del paquete PWA y catálogo actual
        run: |
          python - <<'PY'
          import json,pathlib,re
          html=pathlib.Path('index.html').read_text()
          sw=pathlib.Path('sw.js').read_text()
          app=pathlib.Path('app.js').read_text()
          eng=pathlib.Path('engine.js').read_text()
          assert '2.2.0' in html and '?v=220' in html
          assert 'mi-rodalies-v2.2.0' in sw and '?v=220' in sw
          assert 'correlateTimetableBoards' in eng and 'mergeSupplementalJourneys' in eng
          assert 'E.correlateTimetableBoards' in app and 'E.mergeSupplementalJourneys' in app
          c=json.loads(pathlib.Path('data/v2/catalog.json').read_text())
          assert len(c['lines'])==19 and len(c['stations'])>=200
          for code in ['78710','78805','71801']:
            st=next(s for s in c['stations'] if s['id']==code)
            assert 'R4' in st['schedule_lines']
          print('OK versión, caché, correlación y 3 estaciones principales de R4')
          PY
      - name: Prueba de contratos públicos (con límite de uso)
        run: |
          node tests/test_trenalia_live.cjs
          node tests/test_trenalia_alignment.cjs
          node tests/test_live_anonymous_eta.cjs
