name: Monitor official PDF changes
on:
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_pdf_changes.py'
      - '.github/workflows/check-pdf-changes.yml'
permissions:
  contents: read
jobs:
  pdf-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/check_pdf_changes.py
      - run: python scripts/check_pdf_changes.py
