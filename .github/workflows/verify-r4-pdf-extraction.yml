name: Validar extracción de todos los trenes R4 del PDF oficial
on:
  push:
    branches: [fix/r4-missing-stops-official-pdf-20261112]
    paths:
      - scripts/extract_official_r4.py
      - .github/workflows/verify-r4-pdf-extraction.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install 'pymupdf>=1.24,<1.28'
      - name: Interpretar horarios R4 de las cuatro tablas oficiales
        run: python scripts/extract_official_r4.py --out /tmp/r4_official_timetable.json
      - uses: actions/upload-artifact@v4
        with:
          name: r4-official-timetable-validated
          path: /tmp/r4_official_timetable.json
          retention-days: 5
